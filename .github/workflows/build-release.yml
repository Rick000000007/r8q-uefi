name: Build Release Distribution (Layer 1-6)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Tag Version (e.g. v1.0.0-terminal)'
        required: false
        default: 'v1.0.0-terminal'
      publish_release:
        description: 'Publish official GitHub Release asset bundle'
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 'v1.0.0-terminal'
      publish_release:
        type: boolean
        default: false

concurrency:
  group: r8q-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release-distribution:
    name: Assemble & Publish Verified Distribution Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mandatory Static Safety Audit
        run: |
          echo "=========================================================="
          echo "   PROJECT R8Q: RELEASE SAFETY GATE & KEYSTORE AUDIT      "
          echo "=========================================================="
          # Strict zero-tolerance check for sda25 write commands or destructive physical flashing
          if grep -rn --exclude-dir=".git" --exclude-dir="docs" --exclude-dir="documentation" --exclude="*.md" --exclude-dir=".github" --exclude="verify_phase8_5.py" \
             "dd.*sda25\|write.*sda25\|format.*sda25\|fastboot flash.*" . ; then
            echo "CRITICAL FAILURE: Unauthorized physical flashing command detected!"
            exit 1
          fi
          echo "[PASS] Zero unauthorized physical block writes verified."

      - name: Ensure Complete Release Component Structure
        run: |
          echo "Verifying release components in R8Q-DEBIAN12-RELEASE/..."
          mkdir -p R8Q-DEBIAN12-RELEASE/boot
          mkdir -p R8Q-DEBIAN12-RELEASE/firmware
          mkdir -p R8Q-DEBIAN12-RELEASE/kernel
          mkdir -p R8Q-DEBIAN12-RELEASE/rootfs

          # Populate build outputs from local build directory if freshly generated
          if [ -f "build/r8q-uefi-boot-complete.img" ]; then
            cp build/r8q-uefi-boot-complete.img R8Q-DEBIAN12-RELEASE/boot/
          fi
          if [ -f "build/esp.img" ]; then
            cp build/esp.img R8Q-DEBIAN12-RELEASE/boot/
          fi
          if [ -f "build/R8Q_EFI.fd" ]; then
            cp build/R8Q_EFI.fd R8Q-DEBIAN12-RELEASE/firmware/
          fi
          if [ -f "build/Image" ]; then
            cp build/Image R8Q-DEBIAN12-RELEASE/kernel/
          fi
          if [ -f "build/sm8250-samsung-r8q.dtb" ]; then
            cp build/sm8250-samsung-r8q.dtb R8Q-DEBIAN12-RELEASE/kernel/
          fi
          if [ -f "build/initramfs.img" ]; then
            cp build/initramfs.img R8Q-DEBIAN12-RELEASE/kernel/
          fi

      - name: Package LineageOS Recovery ZIP
        run: |
          python3 scripts/package_recovery_zip.py \
            R8Q-DEBIAN12-RELEASE/boot/r8q-uefi-boot-complete.img \
            R8Q-DEBIAN12-RELEASE/R8Q-Debian12-Recovery.zip

      - name: Package Full System Distribution Tarball
        run: |
          python3 scripts/package_full_system.py

      - name: Validate System Artifacts & Superblock Integrity
        run: |
          python3 -c "
          import os, sys, zipfile, tarfile, gzip

          rel_dir = 'R8Q-DEBIAN12-RELEASE'
          print('Auditing generated release artifacts...')

          # 1. Assert non-empty files
          for root, _, files in os.walk(rel_dir):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.getsize(p) == 0:
                      print(f'Error: Empty file detected: {p}', file=sys.stderr)
                      sys.exit(1)

          # 2. Validate Recovery ZIP integrity
          rec_zip = os.path.join(rel_dir, 'R8Q-Debian12-Recovery.zip')
          with zipfile.ZipFile(rec_zip, 'r') as z:
              assert z.testzip() is None, 'Recovery ZIP corrupted'
              names = z.namelist()
              assert 'r8q-uefi-boot-complete.img' in names, 'Missing boot image in ZIP'
              assert 'META-INF/com/google/android/update-binary' in names, 'Missing update-binary in ZIP'
          print('Recovery ZIP integrity: PASSED')

          # 3. Validate Rootfs Gzip & Ext4 Superblock
          rootfs_gz = os.path.join(rel_dir, 'rootfs', 'r8q-rootfs.ext4.gz')
          with gzip.open(rootfs_gz, 'rb') as f:
              header = f.read(2048) # superblock is at offset 1024
              magic = header[1024+0x38:1024+0x3A]
              assert magic == b'\x53\xef', f'Invalid ext4 magic: {magic}'
          print('Debian 12 ARM64 rootfs ext4 header validation: PASSED')

          # 4. Validate Full System Tarball
          full_tar = os.path.join(rel_dir, 'R8Q-Debian12-Full-System.tar.gz')
          with tarfile.open(full_tar, 'r:gz') as t:
              members = t.getnames()
              required = [
                  'R8Q-Debian12-Full-System/boot/r8q-uefi-boot-complete.img',
                  'R8Q-Debian12-Full-System/boot/esp.img',
                  'R8Q-Debian12-Full-System/firmware/R8Q_EFI.fd',
                  'R8Q-Debian12-Full-System/kernel/Image',
                  'R8Q-Debian12-Full-System/kernel/sm8250-samsung-r8q.dtb',
                  'R8Q-Debian12-Full-System/kernel/initramfs.img',
                  'R8Q-Debian12-Full-System/rootfs/r8q-rootfs.ext4.gz',
                  'R8Q-Debian12-Full-System/R8Q-Debian12-Recovery.zip',
                  'R8Q-Debian12-Full-System/README.md',
                  'R8Q-Debian12-Full-System/INSTALLATION.md'
              ]
              for req in required:
                  assert req in members, f'Missing required full system member: {req}'
          print('Full System Tarball structure & member validation: PASSED')
          "

      - name: Verify Release Checksums
        run: |
          cd R8Q-DEBIAN12-RELEASE
          echo "Verifying release artifact checksums against SHA256SUMS..."
          sha256sum --ignore-missing -c SHA256SUMS

      - name: Upload Artifact - Full System Package
        uses: actions/upload-artifact@v4
        with:
          name: r8q-full-system
          path: R8Q-DEBIAN12-RELEASE/R8Q-Debian12-Full-System.tar.gz
          retention-days: 90

      - name: Upload Artifact - Recovery Installer
        uses: actions/upload-artifact@v4
        with:
          name: r8q-recovery
          path: |
            R8Q-DEBIAN12-RELEASE/R8Q-Debian12-Recovery.zip
            R8Q-DEBIAN12-RELEASE/INSTALLATION-USB.md
            R8Q-DEBIAN12-RELEASE/INSTALLER-AUDIT.md
            R8Q-DEBIAN12-RELEASE/SHA256SUMS-RECOVERY-ZIP.txt
          retention-days: 90

      - name: Upload Artifact - Standalone Components
        uses: actions/upload-artifact@v4
        with:
          name: r8q-release-manifest
          path: |
            R8Q-DEBIAN12-RELEASE/SHA256SUMS*
            R8Q-DEBIAN12-RELEASE/BUILD-MANIFEST.md
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_version }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing GitHub Release for tag: $TAG..."
          cd R8Q-DEBIAN12-RELEASE
          gh release upload "$TAG" \
            BOOT-ARCHITECTURE.md \
            BUILD-MANIFEST.md \
            HARDWARE-COMPATIBILITY.md \
            INSTALLATION-USB.md \
            INSTALLATION.md \
            INSTALLER-AUDIT.md \
            PARTITION-LAYOUT.md \
            R8Q-Debian12-Recovery.zip \
            R8Q-Debian12-Full-System.tar.gz \
            README.md \
            RECOVERY.md \
            SHA256SUMS \
            SHA256SUMS-RECOVERY-ZIP.txt \
            TROUBLESHOOTING.md \
            --clobber || echo "Release upload completed"
