name: Build Release Distribution (Layer 1-6)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional Master CI run ID for artifact staging (auto-resolves latest successful run for commit SHA if empty)'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Release Tag Version (e.g. v1.0.0-terminal)'
        required: false
        default: 'v1.0.0-terminal'
      publish_release:
        description: 'Publish official GitHub Release asset bundle (manual authorization required)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 'v1.0.0-terminal'
      publish_release:
        type: boolean
        default: false
      use_workflow_artifacts:
        type: boolean
        default: false

concurrency:
  group: r8q-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  distribution-validation-staging:
    name: Distribution Validation & Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Distribution Verification Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools device-tree-compiler

      - name: Mandatory Static Safety Audit
        run: |
          echo "=========================================================="
          echo "   PROJECT R8Q: RELEASE SAFETY GATE & KEYSTORE AUDIT      "
          echo "=========================================================="
          if grep -rn --exclude-dir=".git" --exclude-dir="docs" --exclude-dir="documentation" --exclude="*.md" --exclude-dir=".github" --exclude="verify_phase8_5.py" \
             "dd.*sda25\|write.*sda25\|format.*sda25\|fastboot flash.*" . ; then
            echo "CRITICAL FAILURE: Unauthorized physical flashing command detected!"
            exit 1
          fi
          echo "[PASS] Zero unauthorized physical block writes verified."

      # Workflow-call path: download all 10 mandatory artifacts explicitly from current run
      - name: Download Artifact - UEFI Firmware Volume
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-uefi-firmware-volume
          path: .ci-artifacts/r8q-uefi-firmware-volume

      - name: Download Artifact - Boot Manager & Setup Utility
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-boot-manager-and-setup
          path: .ci-artifacts/r8q-boot-manager-and-setup

      - name: Download Artifact - Linux Kernel & Device Tree
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-kernel-and-dtb
          path: .ci-artifacts/r8q-kernel-and-dtb

      - name: Download Artifact - Initramfs
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-initramfs
          path: .ci-artifacts/r8q-initramfs

      - name: Download Artifact - Debian 12 Rootfs
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-debian12-rootfs
          path: .ci-artifacts/r8q-debian12-rootfs

      - name: Download Artifact - Debian 12 Rootfs Metadata
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-debian12-rootfs-meta
          path: .ci-artifacts/r8q-debian12-rootfs-meta

      - name: Download Artifact - FAT32 ESP Disk Image
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-esp
          path: .ci-artifacts/r8q-esp

      - name: Download Artifact - Compound Boot Image
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-complete-boot-img
          path: .ci-artifacts/r8q-complete-boot-img

      - name: Download Artifact - Full System Distribution
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-full-system-distribution
          path: .ci-artifacts/r8q-full-system-distribution

      - name: Download Artifact - Recovery Installer ZIP
        if: ${{ inputs.use_workflow_artifacts == true }}
        uses: actions/download-artifact@v4
        with:
          name: r8q-recovery-installer-zip
          path: .ci-artifacts/r8q-recovery-installer-zip

      # Standalone workflow_dispatch path: resolve verified Master CI run for this commit SHA (no stale release fallback)
      - name: Resolve Verified Master CI Run (Standalone Dispatch)
        if: ${{ inputs.use_workflow_artifacts != true }}
        id: resolve-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.source_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "r8q-complete-build.yml" \
              --commit "${{ github.sha }}" \
              --status success \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")] | .[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful Master CI pipeline run found for commit ${{ github.sha }}."
            echo "Run r8q-complete-build.yml or supply a verified source_run_id; stale release downloads are prohibited."
            exit 1
          fi
          RUN_CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "ERROR: Source Master CI run $RUN_ID has conclusion '$RUN_CONCLUSION' (must be 'success')."
            exit 1
          fi
          echo "Resolved verified Master CI run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts From Verified Master CI Run (Standalone Dispatch)
        if: ${{ inputs.use_workflow_artifacts != true }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve-source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .ci-artifacts

      - name: Validate Payloads, Verify Digests & Stage Consolidated Distribution
        run: |
          chmod +x scripts/validate_and_stage_distribution.py
          python3 scripts/validate_and_stage_distribution.py \
            --artifacts-dir .ci-artifacts \
            --dist-dir dist-staging/R8Q-Debian12-Distribution \
            --release-version "${{ inputs.release_version || 'v1.0.0-terminal' }}"

      - name: Verify Consolidated Checksum Manifest & Print Artifact Inventory
        run: |
          cd dist-staging/R8Q-Debian12-Distribution
          sha256sum -c SHA256SUMS.dist
          sha256sum -c SHA256SUMS.ci
          echo "=========================================================="
          cat BUILD-INVENTORY.md
          echo "=========================================================="

      - name: Upload Consolidated Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8q-consolidated-distribution
          path: dist-staging/R8Q-Debian12-Distribution/
          retention-days: 30
          if-no-files-found: error

  github-release-publication:
    name: GitHub Release Publication
    needs: distribution-validation-staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Consolidated Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: r8q-consolidated-distribution
          path: dist-release

      - name: Verify Distribution Integrity Prior to Publication
        run: |
          cd dist-release
          sha256sum -c SHA256SUMS.dist
          sha256sum -c SHA256SUMS.ci

      - name: Publish Authorized GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ERROR: GitHub Release publication requires manual workflow_dispatch authorization."
            exit 1
          fi
          TAG="${{ inputs.release_version }}"
          if [ -z "$TAG" ]; then
            echo "ERROR: Explicit release_version tag must be supplied for release publication."
            exit 1
          fi
          cd dist-release
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Project R8Q Release $TAG" \
              --notes-file BUILD-INVENTORY.md \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            BOOT-ARCHITECTURE.md \
            BUILD-INVENTORY.json \
            BUILD-INVENTORY.md \
            BUILD-MANIFEST.md \
            HARDWARE-COMPATIBILITY.md \
            INSTALLATION-USB.md \
            INSTALLATION.md \
            INSTALLER-AUDIT.md \
            PARTITION-LAYOUT.md \
            R8Q-Debian12-Full-System.tar.gz \
            R8Q-Debian12-Recovery.zip \
            README.md \
            RECOVERY.md \
            SHA256SUMS-RECOVERY-ZIP.txt \
            SHA256SUMS.ci \
            SHA256SUMS.dist \
            TROUBLESHOOTING.md \
            boot/esp.img \
            boot/r8q-uefi-boot-complete.img \
            efi/BootManager.efi \
            efi/Setup.efi \
            efi/Shell.efi \
            firmware/R8Q_EFI.fd \
            kernel/Image \
            kernel/initramfs.img \
            kernel/r8q.dtb \
            kernel/sm8250-samsung-r8q.dtb \
            rootfs/r8q-rootfs.ext4.gz \
            rootfs/r8q-rootfs.tar.gz \
            --clobber
