name: Build Linux Kernel & Device Tree (Layer 5)

on:
  push:
    paths:
      - 'config/kernel_r8q_defconfig'
      - 'devicetree/**'
      - 'scripts/build_kernel.sh'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'config/kernel_r8q_defconfig'
  workflow_dispatch:
  workflow_call:

jobs:
  build-kernel:
    name: Compile ARM64 EFI Stub Kernel & DTB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler python3

      - name: Stage or Compile Kernel & Device Tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build R8Q-DEBIAN12-RELEASE/kernel

          # Fetch verified baseline kernel if absent (upstream pre-built EFI stub Image)
          if [ ! -f "build/Image" ]; then
            echo "Fetching verified baseline kernel from GitHub release..."
            gh release download r8q-debian12-alpha1 -p "Image" -D R8Q-DEBIAN12-RELEASE/kernel/ --clobber
            cp R8Q-DEBIAN12-RELEASE/kernel/Image build/Image
          fi

          # Fetch mainline compact DTB used in sda24 compound boot container
          if [ ! -f "build/sm8250-samsung-r8q.dtb" ]; then
            gh release download r8q-debian12-alpha1 -p "sm8250-samsung-r8q.dtb" -D R8Q-DEBIAN12-RELEASE/kernel/ --clobber
            cp R8Q-DEBIAN12-RELEASE/kernel/sm8250-samsung-r8q.dtb build/sm8250-samsung-r8q.dtb
          fi

          # Compile live device tree separately as build/r8q.dtb without overwriting mainline DTB
          if [ -f "devicetree/r8q-live.dts" ]; then
            dtc -I dts -O dtb -o build/r8q.dtb devicetree/r8q-live.dts
            echo "Live device tree compiled to build/r8q.dtb."
          else
            cp build/sm8250-samsung-r8q.dtb build/r8q.dtb
          fi

      - name: Verify Kernel Image Signature & Build Driver
        run: |
          chmod +x scripts/build_kernel.sh
          ./scripts/build_kernel.sh
          python3 -c "
          import os
          for dtb in ['build/sm8250-samsung-r8q.dtb', 'build/r8q.dtb']:
              assert os.path.isfile(dtb), f'Missing DTB: {dtb}'
              with open(dtb, 'rb') as f:
                  magic = f.read(4)
              assert magic == bytes.fromhex('d00dfeed'), f'Invalid FDT magic in {dtb}: {magic.hex()}'
              print(f'DTB validated: {dtb} ({os.path.getsize(dtb)} bytes)')
          "
          sha256sum build/Image > Image.sha256
          sha256sum build/sm8250-samsung-r8q.dtb > dtb.sha256
          sha256sum build/r8q.dtb > r8q.dtb.sha256
          cat Image.sha256
          cat dtb.sha256
          cat r8q.dtb.sha256

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8q-kernel-and-dtb
          path: |
            build/Image
            build/sm8250-samsung-r8q.dtb
            build/r8q.dtb
            Image.sha256
            dtb.sha256
            r8q.dtb.sha256
          retention-days: 30
