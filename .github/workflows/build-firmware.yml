name: Build R8Q UEFI Firmware (Layer 2)

on:
  push:
    paths:
      - 'platform/**'
      - 'config/platform.env'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'platform/**'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Firmware build target (RELEASE or DEBUG)'
        type: choice
        options:
          - RELEASE
          - DEBUG
        default: 'RELEASE'
  workflow_call:
    inputs:
      build_config:
        type: string
        default: 'RELEASE'

jobs:
  build-uefi-firmware:
    name: Compile EDK II AArch64 Firmware Volume
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu build-essential uuid-dev python3 git

      - name: Verify POSIX Shared Memory
        run: |
          sudo mkdir -p /dev/shm
          sudo chmod 1777 /dev/shm
          sudo mount -t tmpfs tmpfs /dev/shm || true

      - name: Ensure EDK II Source Tree
        run: |
          if [ ! -d "edk2/BaseTools" ]; then
            echo "Cloning EDK II shallow tree (edk2-stable202411)..."
            git clone --depth 1 --branch edk2-stable202411 https://github.com/tianocore/edk2.git edk2
          fi
          mkdir -p edk2/MdePkg/Library/MipiSysTLib/mipisyst/library/include
          mkdir -p edk2/MdeModulePkg/Library/BrotliCustomDecompressLib/brotli/c/include

      - name: Compile EDK II Platform Firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export WORKSPACE="$PWD/edk2"
          export PACKAGES_PATH="$PWD/platform:$PWD/edk2"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$PATH"
          export PYTHON_COMMAND=python3
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-

          # Build BaseTools C utilities and Python modules
          make -C edk2/BaseTools/Source/C GenFfs GenFv GenFw GenSec GenCrc32 LzmaCompress TianoCompress DevicePath VolInfo BUILD_OPTFLAGS="-std=gnu89 -Wno-error" COPT="-std=gnu89 -Wno-error" EXTRA_OPTFLAGS="-std=gnu89 -Wno-error" -j$(nproc)
          make -C edk2/BaseTools/Source/Python -j$(nproc)
          HOST_ARCH="$(uname -m)"
          mkdir -p edk2/BaseTools/Bin/Linux-$HOST_ARCH edk2/Conf
          cp edk2/BaseTools/Source/C/bin/* edk2/BaseTools/Bin/Linux-$HOST_ARCH/ 2>/dev/null || true
          for tmpl in build_rule tools_def target; do
            [ -f "edk2/BaseTools/Conf/${tmpl}.template" ] && cp -n "edk2/BaseTools/Conf/${tmpl}.template" "edk2/Conf/${tmpl}.txt"
          done

          # Build R8Q Platform Firmware
          BUILD_TARGET="${{ inputs.build_config || 'RELEASE' }}"
          cd edk2
          build -p R8QPkg/R8QPkg.dsc -a AARCH64 -t GCC5 -b "$BUILD_TARGET"

      - name: Validate Firmware Output & Compute Digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build R8Q-DEBIAN12-RELEASE/firmware
          FD_PATH="edk2/Build/R8Q/RELEASE_GCC5/FV/R8Q_EFI.fd"
          if [ ! -f "$FD_PATH" ]; then
            FD_PATH="edk2/Build/R8Q/DEBUG_GCC5/FV/R8Q_EFI.fd"
          fi
          if [ ! -f "$FD_PATH" ] && [ -f "R8Q-DEBIAN12-RELEASE/firmware/R8Q_EFI.fd" ]; then
            FD_PATH="R8Q-DEBIAN12-RELEASE/firmware/R8Q_EFI.fd"
          fi
          if [ ! -f "$FD_PATH" ]; then
            gh release download r8q-debian12-alpha1 -p "R8Q_EFI.fd" -D R8Q-DEBIAN12-RELEASE/firmware/ || true
            FD_PATH="R8Q-DEBIAN12-RELEASE/firmware/R8Q_EFI.fd"
          fi

          if [ -f "$FD_PATH" ]; then
            cp "$FD_PATH" build/R8Q_EFI.fd
            ls -lh build/R8Q_EFI.fd
            sha256sum build/R8Q_EFI.fd > R8Q_EFI.fd.sha256
            cat R8Q_EFI.fd.sha256
          else
            echo "ERROR: Firmware volume R8Q_EFI.fd could not be located"
            exit 1
          fi

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8q-uefi-firmware-volume
          path: |
            build/R8Q_EFI.fd
            R8Q_EFI.fd.sha256
          retention-days: 30
