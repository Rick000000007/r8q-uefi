name: Build Early-Userspace Initramfs (Layer 5)

on:
  push:
    paths:
      - 'scripts/build_initramfs.sh'
      - '.github/workflows/build-initramfs.yml'
  pull_request:
    paths:
      - 'scripts/build_initramfs.sh'
  workflow_dispatch:
  workflow_call:

jobs:
  build-initramfs:
    name: Generate CPIO Initramfs Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install BusyBox & Archive Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip python3

      - name: Build or Stage Initramfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build R8Q-DEBIAN12-RELEASE/kernel
          if [ ! -f "R8Q-DEBIAN12-RELEASE/kernel/initramfs.img" ]; then
            gh release download r8q-debian12-alpha1 -p "initramfs.img" -D R8Q-DEBIAN12-RELEASE/kernel/ || true
          fi
          if [ -f "R8Q-DEBIAN12-RELEASE/kernel/initramfs.img" ]; then
            cp R8Q-DEBIAN12-RELEASE/kernel/initramfs.img build/initramfs.img
            # Extract verified ARM64 busybox to build directory
            mkdir -p /tmp/arm64_bin
            (cd /tmp/arm64_bin && gzip -dc "$GITHUB_WORKSPACE/build/initramfs.img" | cpio -idm "bin/busybox" 2>/dev/null || true)
            if [ -f "/tmp/arm64_bin/bin/busybox" ]; then
              export BUSYBOX_ARM64="/tmp/arm64_bin/bin/busybox"
              chmod +x "$BUSYBOX_ARM64"
            fi
          fi

          chmod +x scripts/build_initramfs.sh
          ./scripts/build_initramfs.sh

          if [ -f "build/initramfs.img" ]; then
            sha256sum build/initramfs.img > initramfs.img.sha256
            cat initramfs.img.sha256
          fi

      - name: Validate Initramfs Archive
        run: |
          python3 tests/test_initramfs_validation.py

      - name: Upload Initramfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8q-initramfs
          path: |
            build/initramfs.img
            initramfs.img.sha256
          retention-days: 30
