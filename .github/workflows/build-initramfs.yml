name: Build Early-Userspace Initramfs (Layer 5)

on:
  push:
    paths:
      - 'scripts/build_initramfs.sh'
      - '.github/workflows/build-initramfs.yml'
  pull_request:
    paths:
      - 'scripts/build_initramfs.sh'
  workflow_dispatch:
  workflow_call:

jobs:
  build-initramfs:
    name: Generate CPIO Initramfs Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install BusyBox & Archive Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip python3

      - name: Build or Stage Initramfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build R8Q-DEBIAN12-RELEASE/kernel
          if [ ! -f "R8Q-DEBIAN12-RELEASE/kernel/initramfs.img" ]; then
            gh release download r8q-debian12-alpha1 -p "initramfs.img" -D R8Q-DEBIAN12-RELEASE/kernel/ --clobber
          fi
          cp R8Q-DEBIAN12-RELEASE/kernel/initramfs.img build/initramfs.img

          chmod +x scripts/build_initramfs.sh
          ./scripts/build_initramfs.sh

          sha256sum build/initramfs.img > initramfs.img.sha256
          cat initramfs.img.sha256

      - name: Validate Initramfs Archive
        run: |
          python3 tests/test_initramfs_validation.py
          python3 -c "
          import gzip, subprocess
          entries = set(subprocess.check_output(['sh', '-c', 'gzip -dc build/initramfs.img | cpio -t 2>/dev/null'], text=True).splitlines())
          required = [
              'bin/busybox',
              'lib/ld-linux-aarch64.so.1',
              'lib/libc.so.6',
              'lib/modules/virtio_blk.ko',
              'lib/modules/ext4.ko',
              'lib/modules/jbd2.ko',
              'lib/modules/mbcache.ko',
              'lib/modules/crc16.ko',
          ]
          for item in required:
              assert item in entries, f'Missing critical initramfs member: {item}'
          print('Initramfs ARM64 libraries & kernel modules verified PASSED.')
          "
          sha256sum build/initramfs.img > initramfs.img.sha256
          cat initramfs.img.sha256

      - name: Upload Initramfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8q-initramfs
          path: |
            build/initramfs.img
            initramfs.img.sha256
          retention-days: 30
