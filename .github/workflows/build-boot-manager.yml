name: Build R8Q Boot Manager & Setup (Layer 3 & 4)

on:
  push:
    paths:
      - 'platform/R8QPkg/Applications/**'
      - 'boot-manager/**'
      - '.github/workflows/build-boot-manager.yml'
  pull_request:
    paths:
      - 'platform/R8QPkg/Applications/**'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build target (DEBUG or RELEASE)'
        type: choice
        options:
          - DEBUG
          - RELEASE
        default: 'DEBUG'
      clean_build:
        description: 'Perform clean application build'
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_config:
        type: string
        default: 'DEBUG'
      clean_build:
        type: boolean
        default: false

jobs:
  build-boot-manager:
    name: Compile Standalone BootManager.efi & Setup.efi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential uuid-dev mtools python3 git util-linux

      - name: Verify POSIX Shared Memory
        run: |
          sudo mkdir -p /dev/shm
          sudo chmod 1777 /dev/shm
          mountpoint -q /dev/shm || sudo mount -t tmpfs tmpfs /dev/shm

      - name: Ensure EDK II Source Tree
        run: |
          if [ ! -d "edk2/BaseTools" ]; then
            echo "Cloning EDK II shallow tree (edk2-stable202411)..."
            git clone --depth 1 --branch edk2-stable202411 https://github.com/tianocore/edk2.git edk2
          fi
          mkdir -p edk2/MdePkg/Library/MipiSysTLib/mipisyst/library/include
          mkdir -p edk2/MdeModulePkg/Library/BrotliCustomDecompressLib/brotli/c/include

      - name: Build Setup.efi & BootManager.efi
        run: |
          export WORKSPACE="$PWD/edk2"
          export PACKAGES_PATH="$PWD/platform:$PWD/edk2"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$PATH"
          export PYTHON_COMMAND=python3
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-

          if [ "${{ inputs.clean_build }}" = "true" ]; then
            rm -rf edk2/Build/R8Q
          fi

          # Build BaseTools C utilities and Python modules
          make -C edk2/BaseTools/Source/C GenFfs GenFv GenFw GenSec GenCrc32 LzmaCompress TianoCompress DevicePath VolInfo BUILD_OPTFLAGS="-std=gnu89 -Wno-error" COPT="-std=gnu89 -Wno-error" EXTRA_OPTFLAGS="-std=gnu89 -Wno-error" -j$(nproc)
          make -C edk2/BaseTools/Source/Python -j$(nproc)
          HOST_ARCH="$(uname -m)"
          mkdir -p edk2/BaseTools/Bin/Linux-$HOST_ARCH edk2/Conf
          cp -f edk2/BaseTools/Source/C/bin/* edk2/BaseTools/Bin/Linux-$HOST_ARCH/
          test -x "edk2/BaseTools/Bin/Linux-$HOST_ARCH/GenFfs"
          for tmpl in build_rule tools_def target; do
            [ -f "edk2/BaseTools/Conf/${tmpl}.template" ] && cp -n "edk2/BaseTools/Conf/${tmpl}.template" "edk2/Conf/${tmpl}.txt"
          done

          TARGET="${{ inputs.build_config || 'DEBUG' }}"
          cd edk2
          build -p R8QPkg/R8QPkg.dsc -a AARCH64 -t GCC5 -b "$TARGET"

      - name: Verify Applications & PE32+ Signatures
        run: |
          mkdir -p output_bins build
          TARGET="${{ inputs.build_config || 'DEBUG' }}"
          BIN_DIR="edk2/Build/R8Q/${TARGET}_GCC5/AARCH64"
          REQUIRED_APPS=(
            Setup BootManager Shell LinuxBoot
            sysinfo cpuinfo memmap diagnostics
            storage display battery thermal
            fdtinfo firmware CoreTest StorageTest ShellTest
          )
          for app in "${REQUIRED_APPS[@]}"; do
            if [ ! -f "$BIN_DIR/${app}.efi" ]; then
              echo "ERROR: Required EFI application missing: $BIN_DIR/${app}.efi"
              exit 1
            fi
            cp "$BIN_DIR/${app}.efi" output_bins/
          done
          cp "$BIN_DIR/Setup.efi" build/
          cp "$BIN_DIR/BootManager.efi" build/

          python3 -c "
          import os, struct
          for name in ['Setup.efi', 'BootManager.efi', 'Shell.efi', 'sysinfo.efi', 'LinuxBoot.efi']:
              p = os.path.join('output_bins', name)
              with open(p, 'rb') as f:
                  data = f.read()
              assert data[:2] == b'MZ', f'{name}: missing MZ signature'
              pe_off = struct.unpack_from('<I', data, 0x3C)[0]
              assert data[pe_off:pe_off+4] == b'PE\x00\x00', f'{name}: missing PE header'
              machine = struct.unpack_from('<H', data, pe_off+4)[0]
              assert machine == 0xAA64, f'{name}: expected AArch64 0xAA64, got 0x{machine:X}'
              print(f'PE32+ AArch64 verification PASSED: {name} ({len(data)} bytes)')
          "

          cd output_bins
          sha256sum *.efi > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Boot Manager Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8q-boot-manager-and-setup
          path: output_bins/
          retention-days: 30
