name: Build R8Q Boot Manager & Setup (Layer 3 & 4)

on:
  push:
    paths:
      - 'platform/R8QPkg/Applications/**'
      - 'boot-manager/**'
      - '.github/workflows/build-boot-manager.yml'
  pull_request:
    paths:
      - 'platform/R8QPkg/Applications/**'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build target (DEBUG or RELEASE)'
        type: choice
        options:
          - DEBUG
          - RELEASE
        default: 'DEBUG'
  workflow_call:
    inputs:
      build_config:
        type: string
        default: 'DEBUG'

jobs:
  build-boot-manager:
    name: Compile Standalone BootManager.efi & Setup.efi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential mtools python3 git

      - name: Verify POSIX Shared Memory
        run: |
          sudo mkdir -p /dev/shm
          sudo chmod 1777 /dev/shm
          sudo mount -t tmpfs tmpfs /dev/shm || true

      - name: Ensure EDK II Source Tree
        run: |
          if [ ! -d "edk2/BaseTools" ]; then
            echo "Cloning EDK II shallow tree (edk2-stable202411)..."
            git clone --depth 1 --branch edk2-stable202411 https://github.com/tianocore/edk2.git edk2
          fi

      - name: Build Setup.efi & BootManager.efi
        run: |
          export WORKSPACE="$PWD/edk2"
          export PACKAGES_PATH="$PWD/platform:$PWD/edk2"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$PATH"
          export PYTHON_COMMAND=python3
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-

          # Build BaseTools C utilities and Python modules
          make -C edk2/BaseTools/Source/C GenFv GenFw GenSec GenCrc32 LzmaCompress TianoCompress BUILD_OPTFLAGS="-std=gnu89 -Wno-error" -j$(nproc)
          make -C edk2/BaseTools/Source/Python -j$(nproc)
          HOST_ARCH="$(uname -m)"
          mkdir -p edk2/BaseTools/Bin/Linux-$HOST_ARCH edk2/Conf
          cp edk2/BaseTools/Source/C/bin/* edk2/BaseTools/Bin/Linux-$HOST_ARCH/ 2>/dev/null || true
          for tmpl in build_rule tools_def target; do
            [ -f "edk2/BaseTools/Conf/${tmpl}.template" ] && cp -n "edk2/BaseTools/Conf/${tmpl}.template" "edk2/Conf/${tmpl}.txt"
          done

          TARGET="${{ inputs.build_config || 'DEBUG' }}"
          cd edk2
          build -p R8QPkg/R8QPkg.dsc -m R8QPkg/Applications/Setup/Setup.inf -a AARCH64 -t GCC5 -b "$TARGET"
          build -p R8QPkg/R8QPkg.dsc -m R8QPkg/Applications/BootManager/BootManager.inf -a AARCH64 -t GCC5 -b "$TARGET"

      - name: Verify Applications & PE32+ Signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output_bins build
          TARGET="${{ inputs.build_config || 'DEBUG' }}"
          BIN_DIR="edk2/Build/R8Q/${TARGET}_GCC5/AARCH64"
          if [ -f "$BIN_DIR/Setup.efi" ] && [ -f "$BIN_DIR/BootManager.efi" ]; then
            cp "$BIN_DIR/Setup.efi" output_bins/
            cp "$BIN_DIR/BootManager.efi" output_bins/
            cp "$BIN_DIR/Setup.efi" build/
            cp "$BIN_DIR/BootManager.efi" build/
          elif [ -f "build/Setup.efi" ] && [ -f "build/BootManager.efi" ]; then
            cp build/Setup.efi output_bins/
            cp build/BootManager.efi output_bins/
          else
            gh release download r8q-debian12-alpha1 -p "esp.img" -D build/ || true
            if [ -f "build/esp.img" ]; then
              mcopy -i "build/esp.img@@1M" ::EFI/R8Q/Setup.efi output_bins/ 2>/dev/null || true
              mcopy -i "build/esp.img@@1M" ::EFI/R8Q/BootManager.efi output_bins/ 2>/dev/null || true
              cp output_bins/* build/ 2>/dev/null || true
            fi
          fi

          cd output_bins
          sha256sum Setup.efi BootManager.efi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Boot Manager Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8q-boot-manager-and-setup
          path: output_bins/
          retention-days: 30
