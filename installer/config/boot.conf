# Project R8Q — Boot & Operating System Policy Configuration
# Enforces terminal-first Debian 12 ARM64 startup; GNOME remains opt-in only.

BOOT_DEFAULT_ENTRY="debian"
BOOT_TIMEOUT_SECONDS=3
BOOT_PRIORITY="ufs,usb,sd"
BOOT_MANAGER_BINARY="BootManager.efi"
UEFI_FALLBACK_PATH="EFI/BOOT/BOOTAA64.EFI"
UEFI_R8Q_DIR="EFI/R8Q"
UEFI_SETUP_BINARY="Setup.efi"
UEFI_SHELL_BINARY="Shell.efi"
UEFI_LINUX_LOADER="LinuxBoot.efi"

LINUX_KERNEL_IMAGE="Image"
LINUX_INITRAMFS_IMAGE="initramfs.img"
LINUX_DTB_MAINLINE="sm8250-samsung-r8q.dtb"
LINUX_DTB_LIVE="r8q.dtb"
LINUX_CMDLINE="console=tty0 console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xa90000 root=LABEL=r8q-rootfs rw rootwait systemd.unified_cgroup_hierarchy=1"

SYSTEMD_DEFAULT_TARGET="multi-user.target"
SYSTEMD_TTY_CONSOLE="getty@tty1.service"
SYSTEMD_UART_CONSOLE="serial-getty@ttyMSM0.service"
OPTIONAL_GNOME_ENABLED=0
OPTIONAL_GNOME_TARGET="graphical.target"
