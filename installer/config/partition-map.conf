# Project R8Q — Partition Map & Storage Safety Configuration
# Reference geometry observed empirically from /sys/block/sda on SM-G781B (r8q).
# Never invent offsets or assume sda23/sda24 are safe without independent map verification.

DEVICE_BLOCK_ROOT="/dev/block/sda"
SECTOR_SIZE=512
PAGE_SIZE=4096

# Strictly forbidden internal UFS / keystore / bootloader targets
FORBIDDEN_TARGETS="sda /dev/block/sda sda21 dsp sda22 dtbo sda23 boot sda25 keyrefuge sda26 keydata sda27 vbmeta_samsung"

# Verified reference bounds (must match live /sys/block/sda or supplied verified map)
SDA23_NAME="boot"
SDA23_START_SECTOR=1237144
SDA23_SECTORS=131072
SDA23_BYTES=67108864
SDA23_PROTECTED=1

SDA24_NAME="recovery"
SDA24_START_SECTOR=1368216
SDA24_SECTORS=161512
SDA24_BYTES=82694144
SDA24_CONTIGUOUS_NEXT="sda25"

SDA25_NAME="keyrefuge"
SDA25_START_SECTOR=1529728
SDA25_SECTORS=32768
SDA25_BYTES=16777216
SDA25_ZERO_ACCESS=1

# Mandatory safety gates
REQUIRE_VERIFIED_PARTITION_MAP=1
ALLOW_ANDROID_OR_RECOVERY_ERASE=0
PHYSICAL_FLASH_AUDIT_APPROVED=0

# Non-destructive external MicroSD / ESP target parameters
DEFAULT_ROOTFS_LABEL="r8q-rootfs"
DEFAULT_ESP_LABEL="R8Q_BOOT"
MIN_ROOTFS_EXT4_BYTES=2147483648
MIN_ESP_BYTES=268435456
MIN_TOTAL_INSTALL_FREE_BYTES=3221225472
